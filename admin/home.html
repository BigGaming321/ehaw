<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-HAW Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/4a7ae8e0aa11048f35e64e91dae3c5a1?family=Brother+1816" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Brother';
      src: url('https://db.onlinewebfonts.com/t/4a7ae8e0aa11048f35e64e91dae3c5a1.woff2') format('woff2'),
           url('https://db.onlinewebfonts.com/t/4a7ae8e0aa11048f35e64e91dae3c5a1.woff') format('woff');
      font-weight: 800;
      font-style: normal;
    }
  </style>
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Logo -->
    <a href="#" class="sidebar__logo">
      <img src="images/7.png" alt="E-HAW Logo" class="logo-icon" />
    </a>

    <!-- Nav -->
    <nav class="sidebar__nav">

      <a href="index.html" class="sidebar__nav-item" title="Dashboard">
        <!-- Dashboard / grid icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="sidebar__nav-label">Dashboard</span>
      </a>

      <a href="reports.html" class="sidebar__nav-item" title="Reports">
        <!-- Bar chart icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/>
        </svg>
        <span class="sidebar__nav-label">Reports</span>
      </a>

      <a href="accounts.html" class="sidebar__nav-item" title="Accounts">
        <!-- Users icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="sidebar__nav-label">Accounts</span>
      </a>

      <a href="queue.html" class="sidebar__nav-item" title="Verification">
        <!-- Shield check icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
        <span class="sidebar__nav-label">Verification</span>
      </a>

    </nav>

    <!-- Footer / Logout -->
    <div class="sidebar__footer">
      <button class="sidebar__logout" title="Log out">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- MAIN -->
  <div class="main-wrapper">

    <!-- Background -->
    <div class="bg-overlay"></div>

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__brand-text">E-HAW Report</span>
      </div>

      <div class="topbar__user" id="userMenu" tabindex="0" role="button" aria-expanded="false">
        <span class="topbar__username" id="usernameDisplay">Admin</span>
        <div class="topbar__avatar">
          <!-- Profile initials -->
          <span class="topbar__avatar-initials" id="avatarInitials">A</span>
        </div>
        <div class="topbar__dropdown" id="dropdownMenu">
          <button class="topbar__dropdown-item" id="logoutBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Log out
          </button>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      <div class="welcome-stage">
        <div class="welcome-logo-wrap">
          <img src="images/7.png" alt="Project E-HAW" class="welcome-logo" />
        </div>
        <p class="welcome-tagline">E-System for Harmonizing Actions and Welfare</p>
      </div>
    </main>

  </div>

  <script src="js/home.js"></script>
</body>
</html>
