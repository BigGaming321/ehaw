<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – E-HAW | Barangay Kamputhaw</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="page">

    <!-- FIXED BACKGROUND -->
    <div class="hero">
      <img class="bg-photo" src="images/otherBG.png" alt="Aerial view of Barangay Kamputhaw" />
    </div>

    <!-- HERO LOGO (above card on mobile, left panel on desktop) -->
    <div class="hero-content">
      <div class="logo-wrapper">
        <img class="hero-logo" src="images/logo_graphic.png" alt="Project E-HAW Logo" />
      </div>
        <p class="hero-subtitle">E-system for Harmonizing Actions and Welfare</p>
    </div>   
    
    <!-- LOGIN CARD -->
    <div class="card">
      <a class="back-link" onclick="history.back()" href="signup.html">
        <!-- left arrow -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
      </a>

      <h1>LOGIN</h1>

      <div class="login-form" id="loginForm">

        <!-- Contact Number -->
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </span>
          <input type="email" id="email" placeholder="Email Address" autocomplete="email" />
        </div>

        <!-- Password -->
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm-3 8V6a3 3 0 016 0v3H9z"/>
            </svg>
          </span>
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
        </div>

        <!-- Forgot Password -->
        <div class="forgot-link">
          <a href="#">Forgot Password?</a>
        </div>

        <button class="btn-login" type="button" id="loginBtn">LOGIN</button>

      </div><!-- /.login-form -->

      <p class="footer-note">
        E-HAW 2026 &nbsp;•&nbsp; A Dedicated NSTP Project for <a href="#">Barangay Kamputhaw</a>
      </p>
    </div><!-- /.card -->

  </div><!-- /.page -->

  <script src="js/login.js"></script>
</body>
</html>
