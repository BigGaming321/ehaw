<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Barangay Kamputhaw</title>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signup.css" />
</head>
<body>
  <div class="page">

    <!-- HERO IMAGE -->
    <div class="hero">
      <img src="images/otherBG.png" alt="Aerial view of Barangay Kamputhaw" />
    </div>

    <!-- HERO TEXT -->
    <div class="hero-content">
      <div class="hero-text">
        <h2>WELCOME!</h2>
        <p>E-System for Harmonizing Actions and Welfare</p>
      </div>
    </div>

    <!-- SIGN UP CARD -->
    <div class="card">
      <a href="index.html" class="back-link">
      <!-- left arrow -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back
        </a>

        <h1>SIGN UP</h1>

        <div class="signup-form" id="signupForm">

        <!-- Username -->
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
            </svg>
          </span>
          <input type="text" id="username" placeholder="Username" autocomplete="username" />
        </div>

        <!-- Contact Number -->
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </span>
          <input type="email" id="email" placeholder="Email Address" autocomplete="email" />
        </div>

        <!-- Password -->
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm-3 8V6a3 3 0 016 0v3H9z"/>
            </svg>
          </span>
          <input type="password" id="password" placeholder="Password" autocomplete="new-password" />
        </div>

        <!-- Confirm Password -->
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm-3 8V6a3 3 0 016 0v3H9z"/>
            </svg>
          </span>
          <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" />
        </div>

        <button class="btn-signup" type="button" id="signupBtn">SIGN UP</button>

        <p class="login-link">Already have an account? <a href="login.html">Log In</a></p>
      </div><!-- /.signup-form -->

      <p class="privacy">
        By creating an account, you consent to the collection and processing of your personal
        information as required by the <a href="data-privacy.html">Data Privacy Act of 2012</a> and the
        <a href="privacy-policy.html">Barangay Kamputhaw Privacy Policy</a>.
      </p>
    </div><!-- /.card -->

  </div><!-- /.page -->

  <script src="js/signup.js"></script>
</body>
</html>
